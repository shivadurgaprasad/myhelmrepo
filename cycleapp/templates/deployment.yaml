apiVersion: apps/v1
kind: Deployment
metadata:
  name: busdeployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
      - name: firstcont
        image: shaikmustafa/cycle
        ports:
        - containerPort: 80   
